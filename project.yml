# XcodeGen 项目定义 — 运行 `xcodegen generate` 生成 Notepad.xcodeproj
name: Notepad
options:
  bundleIdPrefix: com.notepadmac
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: "NO"
    CODE_SIGN_STYLE: Automatic
    # 构建产物固定输出到仓库 build/ 目录（不再落到 ~/Library/Developer/Xcode/DerivedData）：
    #   SYMROOT                  — 中间产物（*.build / XCBuildData / PrecompiledModules）
    #   CONFIGURATION_BUILD_DIR  — 最终产物（App / 测试 bundle），直接落在 build/ 根下
    #
    # 本机绝对路径：/Users/davisx/kimi/notepad/Notepad/build/Notepad.app
    # （$(SRCROOT) 即仓库根，CI runner 上自动展开为各自的 checkout 路径，不能写死绝对路径）
    #
    # 注意：Debug/Release 共用同一产物目录（后构建的覆盖先构建的）。发布不走这条路径，
    # 由 `Scripts/release.sh` 走 archive + 导出到 build/Release/。
    SYMROOT: "$(SRCROOT)/build"
    CONFIGURATION_BUILD_DIR: "$(SRCROOT)/build"

targets:
  Notepad:
    type: application
    platform: macOS
    sources:
      - path: Notepad
        excludes:
          - "Supporting Files/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notepadmac.Notepad
        INFOPLIST_FILE: "Notepad/Supporting Files/Info.plist"
        CODE_SIGN_ENTITLEMENTS: "Notepad/Supporting Files/Notepad.entitlements"
        ENABLE_HARDENED_RUNTIME: "YES"
        GENERATE_INFOPLIST_FILE: "NO"

  NotepadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NotepadTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Notepad

  NotepadUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: NotepadUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Notepad

schemes:
  Notepad:
    build:
      targets:
        Notepad: all
        NotepadTests: [test]
        NotepadUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NotepadTests
        - NotepadUITests
    archive:
      config: Release
