disabled_rules:
  - trailing_whitespace
  - todo

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - redundant_nil_coalescing

line_length:
  warning: 120
  error: 150

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 600
  error: 800

cyclomatic_complexity:
  warning: 14

large_tuple:
  warning: 4

identifier_name:
  excluded:
    - lf
    - cr
    - id

excluded:
  - NotepadTests/
  - NotepadUITests/
  - Packages/
  - build/
